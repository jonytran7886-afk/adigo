        <h1>Kết nối sản phẩm. Mở rộng trải nghiệm.</h1>
        <p>
          ADIGO là nền tảng thương mại và tiêu dùng số thuộc hệ sinh thái Organic Việt Nam, giúp người dùng khám phá, mua sắm và kết nối với những sản phẩm quan tâm trên một nền tảng thông minh, thuận tiện và minh bạch.
        </p>
        <section>
          <h2>Một nền tảng, nhiều trải nghiệm.</h2>
          <p>Khám phá sản phẩm dễ dàng, mua sắm thuận tiện, tiếp cận thông tin sản phẩm minh bạch và kết nối đa dạng sản phẩm cùng nhà bán hàng.</p>
        </section>
        <section>
          <h2>ADIGO App – Mua sắm thông minh trên từng điểm chạm.</h2>
          <p>Ứng dụng ADIGO giúp tìm kiếm sản phẩm, lựa chọn danh mục thực phẩm tươi sống, nông sản, thực phẩm chế biến và theo dõi đơn hàng dễ dàng.</p>
        </section>
        <section>
          <h2>ADIGO Marketplace – Khám phá nhiều hơn. Kết nối rộng hơn.</h2>
          <p>Kết nối sản phẩm, thương hiệu và nhà bán hàng trên một không gian thương mại số trực quan, linh hoạt và mở rộng.</p>
        </section>
        <section>
          <h2>ADIGO Mart – Mua sắm theo cách bạn muốn.</h2>
          <p>Kết nối không gian bán lẻ trực tiếp với trải nghiệm mua sắm số, hỗ trợ tìm điểm bán, đặt hàng trực tuyến và nhận hàng linh hoạt.</p>
        </section>
        <section>
          <h2>Truy xuất nguồn gốc – Minh bạch nguồn gốc, yên tâm lựa chọn.</h2>
          <p>Quét mã QR để theo dõi hành trình sản phẩm từ vùng sản xuất, sơ chế đóng gói, vận chuyển đến điểm bán.</p>
        </section>
        <section>
          <h2>Công nghệ ADIGO – Công nghệ thông minh, kết nối toàn chuỗi.</h2>
          <p>Kết nối dữ liệu, đồng bộ trải nghiệm và cá nhân hóa gợi ý mua sắm trên hệ sinh thái ADIGO.</p>
        </section>
        <section>
          <h2>Hợp tác cùng ADIGO – Cùng kiến tạo hệ sinh thái giá trị bền vững.</h2>
          <p>Cơ hội đồng hành dành cho nhà sản xuất, chủ cửa hàng, đơn vị phân phối và đối tác chiến lược cùng Organic Việt Nam.</p>
